services:
  # ── PostgreSQL 16 ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: pms_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - pms_network
    ports:
      - "5432:5432"         # Expose to host for local tooling (psql, DBeaver, etc.)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s     # Give PostgreSQL time to initialise on first run

  # ── Node.js / Express / TypeScript Backend ──────────────────────────────────
  backend:
    build:
      context: ./backend-node
      dockerfile: Dockerfile
    container_name: pms_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      PORT: ${PORT:-3001}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-your_jwt_access_secret_here}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-your_jwt_refresh_secret_here}
      ACCESS_TOKEN_EXPIRY: ${ACCESS_TOKEN_EXPIRY:-15m}
      REFRESH_TOKEN_EXPIRY: ${REFRESH_TOKEN_EXPIRY:-7d}
      NODE_ENV: ${NODE_ENV:-development}
    ports:
      - "3001:3001"
    networks:
      - pms_network
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend-node:/app
      - /app/node_modules
      - project_storage:/app/storage
    command: npx tsx src/server.ts

# ── Named volumes ────────────────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  project_storage:
    driver: local

# ── Networks ─────────────────────────────────────────────────────────────────
networks:
  pms_network:
    driver: bridge
