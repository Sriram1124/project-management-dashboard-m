# Alembic configuration file
# Reference: https://alembic.sqlalchemy.org/en/latest/tutorial.html

[alembic]
# Path to migration scripts, relative to this file
script_location = alembic

# Template for migration file names
# %(rev)s  — short revision id
# %(slug)s — truncated revision message
# %(epoch)s — creation timestamp (seconds since Unix epoch)
file_template = %%(epoch)s_%%(slug)s

# Timezone for file_template %(epoch)s timestamps
timezone = UTC

# sys.path additions (one per line)
prepend_sys_path = .

# ──────────────────────────────────────────────────────────────────────────────
# sqlalchemy.url is intentionally left empty here.
# The actual DATABASE_URL is read from the environment in alembic/env.py,
# which overrides this value at runtime.
# This prevents credentials from ever being stored in this file.
# ──────────────────────────────────────────────────────────────────────────────
sqlalchemy.url =

# ── Logging ───────────────────────────────────────────────────────────────────
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
